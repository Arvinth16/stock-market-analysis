name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ --output-format=github

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --co -q 2>/dev/null || true
          pytest tests/ -v --tb=short

      - name: Check imports
        run: |
          python -c "from src.core.config import PROJECT_ROOT; print(f'Config OK: {PROJECT_ROOT}')"
          python -c "from src.data.universe import get_symbols; print(f'Universe OK: {len(get_symbols())} stocks')"
          python -c "from src.news.sentiment import analyze_sentiment; print('Sentiment OK')"
