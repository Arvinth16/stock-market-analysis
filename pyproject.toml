[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "india-stock-research"
version = "0.1.0"
description = "AI-powered Indian stock market research and analysis system (NOT trading advice)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "yfinance>=0.2.31",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "gnews>=0.3.7",
    "vaderSentiment>=3.3.2",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "joblib>=1.3.0",
    "mcp>=1.0.0",
    "shap>=0.40.0",
    "schedule>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.1.0"]

[project.scripts]
india-stock = "src.api.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
